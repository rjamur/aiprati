
# Rompendo a Barreira do Som

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aiprati-dev-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network

  redis:
    image: redis:7-alpine
    container_name: aiprati-dev-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - internal_network

  chatwoot:
    image: chatwoot/chatwoot:v4.8.0
    container_name: aiprati-dev-chatwoot
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - RAILS_ENV=${RAILS_ENV}
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${CHATWOOT_BASE_URL}
    networks:
      - internal_network
    command: bundle exec rails s -p 3000 -b 0.0.0.0


  sidekiq:
    image: chatwoot/chatwoot:v4.8.0
    container_name: aiprati-dev-sidekiq
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      - db
      - redis
    environment:
      - NODE_ENV=${NODE_ENV}
      - RAILS_ENV=${RAILS_ENV}
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${CHATWOOT_BASE_URL}
    networks:
      - internal_network

  # Opcional, mas recomendado para o Chatwoot gerenciar tarefas agendadas
  sidekiq_schedule:
    image: chatwoot/chatwoot:v4.8.0
    container_name: aiprati-dev-sidekiq-schedule
    command: bundle exec sidekiq -C config/sidekiq_schedule.yml
    depends_on:
      - db
      - redis
    environment:
      - NODE_ENV=${NODE_ENV}
      - RAILS_ENV=${RAILS_ENV}
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${CHATWOOT_BASE_URL}
    networks:
      - internal_network


  n8n:
    image: n8nio/n8n:latest
    container_name: aiprati-dev-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    env_file: .env # <--- Importante para ler as chaves de criptografia e banco
    environment:
      - N8N_HOST=flow.aiprati.com.br # <--- Sua nova URL de automação
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://flow.aiprati.com.br/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - internal_network
    depends_on:
      - db

  bot_django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiprati-dev-django
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    networks:
      - internal_network
    volumes:
      - ./backend:/app  # Verifique se o caminho da esquerda é onde está seu código

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aiprati-dev-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${DEV_CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal_network

volumes:
  dev_postgres_data:
  n8n_data:

networks:
  internal_network:
    driver: bridge
